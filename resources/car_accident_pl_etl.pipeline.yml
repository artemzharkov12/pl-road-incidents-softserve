resources:
  pipelines:
    bronze_pipeline:
      name: history_car_accident_bronze_pipeline_${bundle.target}
      target: artemzharkov10_bronze
      catalog: dbr_dev
      serverless: true
      libraries:
        - file:
            path: ../src/car_accident_pl_etl/transformations/02_bronze/02_bronze_ingestion.py

    silver_pipeline:
      name: history_car_accident_silver_pipeline_${bundle.target}
      target: artemzharkov10_silver
      catalog: dbr_dev
      serverless: true
      libraries:
        - file:
            path: ../src/car_accident_pl_etl/transformations/03_silver/03_silver_transformations.py

    gold_pipeline:
      name: history_car_accident_gold_pipeline_${bundle.target}
      target: artemzharkov10_gold
      catalog: dbr_dev
      serverless: true
      libraries:
        - file:
            path: ../src/car_accident_pl_etl/transformations/04_gold/04a_gold_dimentions.py
        - file:
            path: ../src/car_accident_pl_etl/transformations/04_gold/04b_gold_facts.py
      environment:
        dependencies:
          - -r /Workspace/Users/${workspace.current_user.userName}/pl-road-incidents-softserve/src/car_accident_pl_etl/requirements.txt