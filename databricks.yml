bundle:
  name: car_accident_pl
  uuid: 810c0ddc-cf64-4266-954f-83ea2f86736f

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use
    default: dbr_dev
  schema:
    description: The schema to use
    default: artemzharkov10_bronze
  prod_cluster_id:
    description: "Cluster ID for production GP1"
    default: "0702-132442-toro5spu"
  cluster_node_type:
    description: "Node type ID for jobs"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-6d6709e1-4e5d.cloud.databricks.com
    variables:
      catalog: dbr_dev
      schema: ${workspace.current_user.short_name}
      cluster_node_type: "i3.xlarge"
      
  prod:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      schema: prod
      cluster_node_type: "Standard_F4"
    permissions:
      - user_name: artemzharkov10@softserve.academy
        level: CAN_MANAGE
    resources:
      jobs:
        history_voivodeship_weather:
          tasks:
            - task_key: 01a_bronze_history_voivodeship
              existing_cluster_id: ${var.prod_cluster_id}
            - task_key: 02a_silver_history_voivodeship
              existing_cluster_id: ${var.prod_cluster_id}
            - task_key: 03a_gold_clustering_weather
              existing_cluster_id: ${var.prod_cluster_id}

        Algorithm_Of_Weather_Clustering:
          tasks:
            - task_key: 03b_gold_accidents_weather_merge
              existing_cluster_id: ${var.prod_cluster_id}
            - task_key: 03c_gold_algorithm_of_claster_weight
              existing_cluster_id: ${var.prod_cluster_id}

        dqx_quality_audit_job:
          tasks:
            - task_key: run_dqx_quality_checks
              existing_cluster_id: ${var.prod_cluster_id}

      dashboards:
        car_accidents_dashboard:
          display_name: "Car Accidents Analytics"
          file_path: ./sql/Car accidents 2018-2024 pl.lvdash.json
          warehouse_id: ${var.prod_warehouse_id}

      pipelines:
        bronze_pipeline:
          serverless: false
          clusters:
            - label: default
              num_workers: 1
              
        silver_pipeline:
          serverless: false
          clusters:
            - label: default
              num_workers: 1
              
        gold_pipeline:
          serverless: false
          clusters:
            - label: default
              num_workers: 1
              