bundle:
  name: car_accident_pl
  uuid: 810c0ddc-cf64-4266-954f-83ea2f86736f

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use
    default: dbr_dev
  schema:
    description: The schema to use
    default: artemzharkov10_bronze
  prod_cluster_id:
    description: "Cluster ID for production GP1"
    default: "0702-132442-toro5spu"
  prod_warehouse_id:
    description: "SQL warehouse"
    default: "3ed106620db591d9"
  cluster_node_type:
    description: "Node type ID for jobs"

resources:
  jobs:
    lab12_rag_pipeline:
      name: "Lab 12 RAG Pipeline"
      job_clusters:
        - job_cluster_key: lab12_cluster
          new_cluster:
            spark_version: 14.3.x-cpu-ml-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
      tasks:
        - task_key: security
          notebook_task:
            notebook_path: ./Lab12/00_rag_security.ipynb
          job_cluster_key: lab12_cluster
          libraries:
            - pypi:
                package: "databricks-sdk>=0.30.0"
            - pypi:
                package: "protobuf<5.0.0"
            
        - task_key: data_prep
          depends_on:
            - task_key: security
          notebook_task:
            notebook_path: ./Lab12/01_rag_data_prep.ipynb
          job_cluster_key: lab12_cluster
          
        - task_key: vector_update
          depends_on:
            - task_key: data_prep
          notebook_task:
            notebook_path: ./Lab12/02_rag_vectors.ipynb
          job_cluster_key: lab12_cluster
          
        - task_key: communication
          depends_on:
            - task_key: vector_update
          notebook_task:
            notebook_path: ./Lab12/03_rag_communication.ipynb
          job_cluster_key: lab12_cluster
          
        - task_key: evaluation
          depends_on:
            - task_key: communication
          notebook_task:
            notebook_path: ./Lab12/04_rag_evaluation_and_monitoring.ipynb
          job_cluster_key: lab12_cluster
  

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-6d6709e1-4e5d.cloud.databricks.com
    variables:
      catalog: dbr_dev
      schema: ${workspace.current_user.short_name}
      cluster_node_type: "i3.xlarge"

  prod:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      schema: prod
      cluster_node_type: "Standard_F4"
    permissions:
      - user_name: artemzharkov10@softserve.academy
        level: CAN_MANAGE

  prod_new:
    mode: production
    workspace:
      host: https://adb-7405615123305702.2.azuredatabricks.net/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev_trial
      schema: prod
      cluster_node_type: "Standard_F4"
    permissions:
      - user_name: artemzharkov10@softserve.academy
        level: CAN_MANAGE