# This is a Declarative Automation Bundle definition for car_accident_pl.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: car_accident_pl
  uuid: 810c0ddc-cf64-4266-954f-83ea2f86736f

include:
  - resources/*.yml

# artifacts:
#   python_artifact:
#     type: whl
#     build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: dbr_dev
  schema:
    description: The schema to use
    default: artemzharkov10_bronze

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6d6709e1-4e5d.cloud.databricks.com
    variables:
      catalog: dbr_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/artemzharkov10@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      schema: prod
    permissions:
      - user_name: artemzharkov10@softserve.academy
        level: CAN_MANAGE
